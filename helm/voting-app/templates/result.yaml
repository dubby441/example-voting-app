apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.result }}
  selector:
    matchLabels: {app: result}
  template:
    metadata:
      labels: {app: result}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: result
          image: "{{ .Values.images.result.repository }}:{{ .Values.images.result.tag }}"
          imagePullPolicy: {{ .Values.images.result.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}

            - name: PGHOST
              value: db
            - name: PGUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.passwordKey }}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.result | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app: result
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {app: result}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
